        portalName:
          type: string
        activeDate:
          type: string
        dueDate:
          type: string
    UserDetailsV2ApiError:
      type: object
      properties:
        field:
          type: string
        message:
          type: string
    AdditionalAttributesDTO:
      type: object
      properties:
        tabId:
          type: integer
          format: int32
        tabName:
          type: string
        attributeId:
          type: integer
          format: int32
        attributeName:
          type: string
        attributeValue:
          type: string
        attributeDataType:
          type: string
    UserInfo:
      type: object
      properties:
        active:
          type: boolean
        userId:
          type: string
